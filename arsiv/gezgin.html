<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Gezgini · Türkiye Bölgesel Veri Analizleri</title>
    <meta name="description" content="Türkiye'nin il, İBBS Düzey 1 ve Düzey 2 bölgelerine ait sosyo-ekonomik göstergeler: harita, grafik ve özet analizler.">
    <link rel="icon" href="/img/logo.png">
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2 style="color: var(--green)">Sayfa Yükleniyor...</h2>
    </div>

    <div class="bg-pattern"></div>

    <header>
        <div class="header-titles">
            <a href="https://www.sanayi.gov.tr" target="_blank" rel="noopener"><img src="/img/logo.png" alt="Logo" class="header-logo"></a>
            <div class="header-text">
                <h1 id="site-baslik"></h1>
                <p id="site-altbaslik"></p>
            </div>
            <a class="hikaye-donus" href="./">← Ana sayfa</a>
            <a class="hikaye-donus katalog-link" href="analiz.html"><i class="fas fa-chart-column"></i> Analiz Masası</a>
            <a class="hikaye-donus katalog-link" href="katalog.html"><i class="fas fa-list-ul"></i> Veri Kataloğu</a>
            <details class="tools-menu">
                <summary><i class="fas fa-th"></i> Araçlar</summary>
                <nav id="tools-nav"></nav>
            </details>
            <a class="hikaye-donus hakkinda-link" href="hakkinda.html">Hakkında</a>
        </div>
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Menü"><i class="fas fa-bars"></i></button>
        <nav id="header-nav" class="header-nav"></nav>
    </header>

    <div class="container">
        <!-- Sol: kaydırmalı bölümler (JS ile oluşturulur) -->
        <div class="scrolly-sections" id="sections-container"></div>

        <!-- Sağ: yapışkan harita, grafik ve kontroller -->
        <div class="sticky-panel">
            <div class="controls-container">
                <div class="control-group" style="flex: 1;">
                    <label for="level-select">Bölge Düzeyi:</label>
                    <select id="level-select">
                        <option value="il">İller</option>
                        <option value="duzey2">Düzey 2</option>
                        <option value="duzey1">Düzey 1</option>
                        <option value="fua">Kentler (OECD)</option>
                        <option value="tr">Türkiye (zaman serisi)</option>
                    </select>
                </div>
                <div class="control-group" style="flex: 2;">
                    <label for="subtopic-select">Alt Başlık:</label>
                    <select id="subtopic-select"></select>
                </div>
                <div class="control-group" style="flex: 0.5;">
                    <label for="year-select">Yıl:</label>
                    <select id="year-select"></select>
                </div>
            </div>

            <div id="trend-panel" class="trend-panel" hidden>
                <h3 id="trend-baslik" class="trend-baslik"></h3>
                <div class="trend-canvas"><canvas id="trend-chart" role="img"></canvas></div>
            </div>

            <div class="map-container">
                <svg id="turkey-map" role="img" aria-label="Türkiye haritası"></svg>
                <div class="tooltip" id="map-tooltip"></div>
            </div>

            <div id="hakkinda-visual" class="hakkinda-visual" hidden>
                <img src="/img/visual.jpg" alt="">
            </div>

            <p class="source-note" id="source-note"></p>
            <p class="gosterge-not" id="gosterge-not" hidden></p>

            <div class="chart-container">
                <canvas id="data-chart"></canvas>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        T.C. Sanayi ve Teknoloji Bakanlığı, Kalkınma Ajansları Genel Müdürlüğü.<br />
        Tüm hakları saklıdır, izinsiz kopyalanamaz.
    </footer>

    <div class="nav-buttons">
        <button id="btn-top" class="nav-btn" title="En Üste Dön"><i class="fa fa-arrow-up"></i></button>
        <button id="btn-prev" class="nav-btn" title="Önceki Konu"><i class="fa fa-chevron-up"></i></button>
        <button id="btn-next" class="nav-btn" title="Sonraki Konu"><i class="fa fa-chevron-down"></i></button>
    </div>

    <script type="module" src="/src/pages/explorer.js"></script>
</body>

</html>
