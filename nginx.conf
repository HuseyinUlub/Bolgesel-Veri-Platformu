server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/csv;
    gzip_min_length 1024;

    # Vite çıktısı (adı hash'li) uzun süre önbelleklenir; veri ve HTML her seferinde denetlenir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }
}
