<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #34495e;
            --accent: #e74c3c;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* KONTROL PANELİ DÜZENİ */
        .controls {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .controls-left {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls-right {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85em;
            color: #555;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            min-width: 150px;
            background-color: #fff;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
            font-size: 13px;
            display: flex;
            align-items: center;
            height: 38px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-green {
            background-color: #27ae60;
        }

        .btn-blue {
            background-color: #2980b9;
        }

        .btn-purple {
            background-color: #8e44ad;
        }

        /* DASHBOARD */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            width: 100%;
            margin: 0;
            color: var(--primary);
        }

        /* HARİTA */
        #map-wrapper {
            width: 100%;
            height: 500px;
            position: relative;
            background: #eef2f3;
            border-radius: 4px;
            overflow: hidden;
        }

        .map-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            padding: 10px;
            background: #fafafa;
            border-radius: 4px;
            border: 1px solid #eee;
            flex-wrap: wrap;
        }

        .map-option-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .map-label {
            font-family: sans-serif;
            font-size: 10px;
            fill: #333;
            pointer-events: none;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            transition: opacity 0.3s;
        }

        .map-label-bold {
            font-weight: bold;
            font-size: 11px;
        }

        /* GRAFİK */
        #chart-container-flex {
            display: flex;
            flex-direction: row;
            height: 500px;
            width: 100%;
            overflow: hidden;
        }

        .chart-controls-area {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            width: 100%;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        /* LEJANT */
        #custom-legend {
            width: 180px;
            min-width: 180px;
            overflow-y: auto;
            border-right: 1px solid #eee;
            padding-right: 10px;
            margin-right: 5px;
            display: none;
            font-family: sans-serif;
            flex-direction: column;
            justify-content: flex-end;
        }

        #custom-legend::-webkit-scrollbar {
            width: 4px;
        }

        #custom-legend::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 2px;
        }

        .legend {
            background: rgba(255, 255, 255, 0.9) !important;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            padding: 4px;
            border-radius: 2px;
            font-size: 11px;
            background: transparent;
            border-bottom: 1px solid #f9f9f9;
        }

        .legend-item:hover {
            background-color: #f5f5f5;
        }

        .legend-left-part {
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .legend-color-box {
            width: 12px;
            height: 12px;
            margin-right: 8px;
            flex-shrink: 0;
            border: none;
        }

        .legend-region {
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
        }

        .legend-value {
            color: #555;
            font-weight: bold;
            margin-left: 5px;
            flex-shrink: 0;
        }

        #chart-canvas-wrapper {
            flex-grow: 1;
            position: relative;
            height: 100%;
        }

        /* TABLO */
        .table-container {
            grid-column: 1 / -1;
            overflow-x: auto;
            max-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #f0f0f0;
        }

        th:last-child,
        td:last-child {
            border-right: none;
        }

        td:nth-child(5) {
            text-align: right;
        }

        th {
            background-color: var(--primary);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .legend-map-item {
            font-size: 11px;
            font-family: sans-serif;
        }

        @media (max-width: 900px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .controls-left,
            .controls-right {
                justify-content: center;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            #chart-container-flex {
                flex-direction: column;
                height: auto;
            }

            #custom-legend {
                width: 100%;
                max-height: 150px;
                border-right: none;
                border-bottom: 1px solid #eee;
                margin-bottom: 10px;
                justify-content: flex-start;
            }

            #chart-canvas-wrapper {
                height: 400px;
            }
        }
    </style>

<body>
    <div class="controls">
        <div class="controls-left">
            <div class="control-group">
                <label>Kategori Seçiniz:</label>
                <select id="categorySelect"></select>
            </div>
            <div class="control-group">
                <label>Veri Türü Seçiniz:</label>
                <select id="dataSelect"></select>
            </div>
            <div class="control-group">
                <label>Yıl Seçiniz:</label>
                <select id="yearSelect"></select>
            </div>
        </div>

        <div class="controls-right">
            <button class="btn-blue" onclick="downloadMap()">Haritayı İndir</button>
            <button class="btn-purple" onclick="downloadChart()">Grafiği İndir</button>
            <button class="btn-green" onclick="downloadExcel()">Tabloyu İndir</button>
        </div>
    </div>

    <div class="dashboard">

        <div class="card" id="card-map">
            <div class="card-header">
                <h2 id="mapTitle" class="card-title">Harita</h2>
            </div>
            <div id="map-wrapper"></div>

            <div class="map-options">
                <div class="map-option-group">
                    <span style="font-weight: 600; font-size: 12px; color: #333;">Etiketler:</span>
                    <label style="font-weight: normal; font-size: 12px; cursor: pointer;">
                        <input type="checkbox" id="chkShowNames" checked onchange="toggleMapLabels()"> Bölge
                    </label>
                    <label style="font-weight: normal; font-size: 12px; cursor: pointer;">
                        <input type="checkbox" id="chkShowValues" checked onchange="toggleMapLabels()"> Değer
                    </label>
                    <label style="font-weight: normal; font-size: 12px; cursor: pointer;">
                        <input type="checkbox" id="chkShowPercents" checked onchange="toggleMapLabels()"> Yüzde
                    </label>
                </div>

                <div class="map-option-group">
                    <span style="font-weight: 600; font-size: 12px; color: #333;">Lejant:</span>
                    <select id="legendPosSelect" style="min-width: 100px; font-size: 12px; padding: 4px;"
                        onchange="updateDashboard()">
                        <option value="bottomLeft">Sol Alt</option>
                        <option value="topLeft">Sol Üst</option>
                        <option value="topRight">Sağ Üst</option>
                        <option value="bottomRight">Sağ Alt</option>
                    </select>
                </div>

                <div class="map-option-group">
                    <span style="font-weight: 600; font-size: 12px; color: #333;">Renkler:</span>
                    <input type="color" id="colorStart" value="#fff9c4" onchange="updateDashboard()"
                        style="width:30px; height:25px; padding:0; border:none; cursor:pointer;">➝
                    <input type="color" id="colorEnd" value="#ef5350" onchange="updateDashboard()"
                        style="width:30px; height:25px; padding:0; border:none; cursor:pointer;">

                    <span style="font-weight: 600; font-size: 12px; color: #333;">Lejant Düzeyi:</span>
                    <select id="legendLevelSelect" style="min-width: 60px; font-size: 12px; padding: 4px;"
                        onchange="updateDashboard()">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5" selected>5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>

        </div>

        <div class="card" id="card-chart">

                <div id="custom-legend"></div>
                <div id="chart-canvas-wrapper">
                    <canvas id="myChart"></canvas>
                </div>
            </div>

            <div class="chart-controls-area">
                <div class="control-group" style="flex-direction: row; align-items: center; gap: 10px;">
                    <label style="margin:0;">Grafik Türü:</label>
                    <select id="chartTypeSelect">
                        <option value="bar">Sütun</option>

        <div class="card table-container">
            <div class="card-header">
                <h2 class="card-title">Veri Tablosu</h2>
            </div>

                <thead>
                    <tr>
                        <th>Bölge Kodu</th>
                        <th>Kategori</th>
                        <th>Veri Türü</th>
                        <th>Yıl</th>

                        <th>Veri Kaynağı</th>
                    </tr>
                </thead>

    <script>
        let rawData = [];
        let geoData = null;
        let chartInstance = null;
        let mapPalette = ["#fff9c4", "#ffe0b2", "#ffcc80", "#ffab91", "#ef5350"];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadData();
        });

        async function loadData() {
            try {
                geoData = await d3.json("./data/nuts1.geojson");

                const response = await fetch("./data/duzey1veri.csv.gz");
                const arrayBuffer = await response.arrayBuffer();
                const decompressedText = pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });

                rawData = d3.dsvFormat(";").parse(decompressedText, (d) => {
                    return {
                        bolge: d['Bölge'] || d['bolge'],
                        kategori: d['Kategori'] || d['kategori'],
                        veri: d['Veri'] || d['veri'],
                        yil: d['Yıl'] || d['yil'],
                        deger: d['Değer'] ? parseFloat(String(d['Değer']).replace(',', '.')) :
                            (d['deger'] ? parseFloat(String(d['deger']).replace(',', '.')) : null),
                        'Veri Kaynağı': d['Veri Kaynağı'] || d['veri kaynagi']
                    };
                });

                initFilters();
            } catch (error) {
                console.error(error);
                alert("Veri yüklenemedi. Lütfen './data/duzey1veri.csv.gz' dosyasının doğru konumda olduğundan emin olun.");
            }
        }

        function createDiagonalPattern(color = 'rgba(0,0,0,0.5)') {
            const shape = document.createElement('canvas');
            shape.width = 10;
            shape.height = 10;
            const c = shape.getContext('2d');
            c.strokeStyle = color;
            c.lineWidth = 2;
            c.beginPath();
            c.moveTo(0, 10);
            c.lineTo(10, 0);
            c.stroke();
            return c.createPattern(shape, 'repeat');
        }

        function initFilters() {
            const categories = [...new Set(rawData.map(d => d.kategori))];
            const catSelect = document.getElementById('categorySelect');

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                catSelect.appendChild(opt);
            });
            if (categories.length > 0) catSelect.value = categories[0];

            const regions = [...new Set(rawData.map(d => d.bolge))].sort();
            const regionSelect = document.getElementById('regionSelect');
            regions.forEach(reg => {
                const opt = document.createElement('option');
                opt.value = reg;
                opt.innerText = reg;
                regionSelect.appendChild(opt);
            });

            catSelect.addEventListener('change', updateTypeSelect);
            document.getElementById('dataSelect').addEventListener('change', updateYearSelect);
            document.getElementById('yearSelect').addEventListener('change', updateDashboard);
            document.getElementById('chartTypeSelect').addEventListener('change', updateDashboard);
            document.getElementById('regionSelect').addEventListener('change', updateDashboard);

            updateTypeSelect();
        }

        function updateTypeSelect() {
            const selectedCat = document.getElementById('categorySelect').value;
            const dataSelect = document.getElementById('dataSelect');
            dataSelect.innerHTML = "";

            const types = [...new Set(rawData
                .filter(d => d.kategori === selectedCat)
                .map(d => d.veri))];

            types.forEach(type => {
                const opt = document.createElement('option');
                opt.value = type;
                opt.innerText = type;
                dataSelect.appendChild(opt);
            });

            updateYearSelect();
        }

        function updateYearSelect() {
            const selectedCat = document.getElementById('categorySelect').value;
            const selectedType = document.getElementById('dataSelect').value;
            const yearSelect = document.getElementById('yearSelect');
            yearSelect.innerHTML = "";

            const years = [...new Set(rawData
                .filter(d => d.kategori === selectedCat && d.veri === selectedType)
                .map(d => d.yil))].sort((a, b) => b - a);

            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.innerText = year;
                yearSelect.appendChild(opt);
            });

            updateDashboard();
        }

        function generateMapPalette(levels) {
            const start = document.getElementById('colorStart').value;
            const end = document.getElementById('colorEnd').value;
            const interpolate = d3.interpolateRgb(start, end);

            if (levels === 1) return [interpolate(0.5)];

            const step = 1.0 / (levels - 1);
            const palette = [];
            for (let i = 0; i < levels; i++) {
                palette.push(interpolate(i * step));
            }
            return palette;
        }

        function updateDashboard() {
            const selectedCat = document.getElementById('categorySelect').value;
            const selectedType = document.getElementById('dataSelect').value;
            const selectedYear = document.getElementById('yearSelect').value;
            const selectedChartType = document.getElementById('chartTypeSelect').value;
            const highlightedRegion = document.getElementById('regionSelect').value;
            const legendLevels = parseInt(document.getElementById('legendLevelSelect').value, 10);

            const filteredData = rawData.filter(d =>
                d.kategori === selectedCat &&
                d.veri === selectedType &&
                String(d.yil) === String(selectedYear)
            );

            const dataMap = {};
            filteredData.forEach(d => {
                dataMap[d.bolge] = d.deger;
            });

            const titleText = `${selectedType} (${selectedYear})`;
            document.getElementById('mapTitle').innerText = titleText;
            document.getElementById('chartTitle').innerText = titleText;

            mapPalette = generateMapPalette(legendLevels);

            drawMap(filteredData, dataMap);
            drawChart(filteredData, selectedChartType, titleText, highlightedRegion);
            drawTable(filteredData);
        }

        function drawMap(data, dataMap) {
            const wrapper = document.getElementById('map-wrapper');
            wrapper.innerHTML = "";
            const width = wrapper.clientWidth;
            const height = wrapper.clientHeight;
            const legendLevels = parseInt(document.getElementById('legendLevelSelect').value, 10);

            const svg = d3.select("#map-wrapper")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("id", "map-svg");

            const g = svg.append("g");

            const zoom = d3.zoom()
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);

                    const k = event.transform.k;
                    // YÜZDE İÇİN DE ZOOM HESAPLAMASI EKLENDİ
                    const codeScreenSize = Math.min(Math.max(11 * k, 9), 14);
                    const valueScreenSize = Math.min(Math.max(10 * k, 9), 14);
                    const percentScreenSize = Math.min(Math.max(9 * k, 9), 14);

                    g.selectAll(".map-label-name").style("font-size", (codeScreenSize / k) + "px");
                    g.selectAll(".map-label-value").style("font-size", (valueScreenSize / k) + "px");
                    g.selectAll(".map-label-percent").style("font-size", (percentScreenSize / k) + "px");
                    g.selectAll("path").attr("stroke-width", 0.5 / k);
                });
            svg.call(zoom);

            if (!geoData) return;

            const projection = d3.geoIdentity().reflectY(true).fitSize([width, height * 0.9], geoData);
            const path = d3.geoPath().projection(projection);

            const values = data.map(d => d.deger).filter(v => v !== null && v !== undefined).sort(d3.ascending);
            const totalValue = d3.sum(data, d => d.deger) || 0;

            const breaks = [];
            if (values.length > 0) {
                const step = 1.0 / legendLevels;
                for (let i = 0; i <= legendLevels; i++) {
                    breaks.push(d3.quantile(values, i * step));
                }

                for (let i = 0; i < breaks.length; i++) {
                    if (breaks[i] === null || breaks[i] === undefined) {
                        const nextValid = breaks.slice(i).find(v => v !== null && v !== undefined);
                        const prevValid = breaks.slice(0, i).reverse().find(v => v !== null && v !== undefined);
                        if (prevValid !== undefined && nextValid !== undefined) {
                            breaks[i] = (prevValid + nextValid) / 2;
                        } else {
                            breaks[i] = prevValid || nextValid || 0;
                        }
                    }
                }
            }

            const colorScale = d3.scaleThreshold()
                .domain(breaks.slice(1, legendLevels))
                .range(mapPalette);

            const isInteger = values.every(v => Number.isInteger(v));

            g.selectAll("path")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("stroke", "#777")
                .attr("stroke-width", 0.5)
                .attr("fill", d => {
                    const val = dataMap[d.properties.shapeName];
                    return val !== undefined ? colorScale(val) : "#eee";
                });

            // 1. SATIR: İSİM ETİKETİ
            g.selectAll("text.code")
                .data(geoData.features)
                .enter()
                .append("text")
                .attr("transform", d => "translate(" + path.centroid(d) + ")")
                .attr("text-anchor", "middle")
                .attr("dy", "-0.4em")
                .attr("class", "map-label map-label-name") // map-label-bold sınıfı çıkarıldı
                .style("font-weight", "normal") // Garantiye almak için eklendi
                .text(d => d.properties.shapeName);

            // 2. SATIR: DEĞER ETİKETİ (Yalnızca değer, eski haline çevrildi)
            g.selectAll("text.value")
                .data(geoData.features)
                .enter()
                .append("text")
                .attr("transform", d => "translate(" + path.centroid(d) + ")")
                .attr("text-anchor", "middle")
                .attr("dy", "0.8em")
                .attr("class", "map-label map-label-value")
                .text(d => {
                    const val = dataMap[d.properties.shapeName];
                    return val !== undefined ? val.toLocaleString('tr-TR', {
                        minimumFractionDigits: isInteger ? 0 : 2,
                        maximumFractionDigits: isInteger ? 0 : 2
                    }) : "";
                });

            // 3. SATIR: YÜZDE ETİKETİ (Yeni satıra eklendi)
            g.selectAll("text.percent")
                .data(geoData.features)
                .enter()
                .append("text")
                .attr("transform", d => "translate(" + path.centroid(d) + ")")
                .attr("text-anchor", "middle")
                .attr("dy", "2.0em")
                .attr("class", "map-label map-label-percent")
                .text(d => {
                    const val = dataMap[d.properties.shapeName];
                    if (val === undefined || val === null || totalValue === 0) return "";

                    const percent = (val / totalValue) * 100;
                    return "%" + percent.toLocaleString('tr-TR', {
                        minimumFractionDigits: 1,
                        maximumFractionDigits: 1
                    });
                });

            const pos = document.getElementById('legendPosSelect').value;
            const legPadding = 10;
            const boxSize = 20;
            let panY = 0;

            const legendGroup = svg.append("g");

            const legendContent = legendGroup.append("g")
                .attr("class", "legend")
                .attr("transform", `translate(${legPadding}, ${legPadding})`);

            for (let i = 0; i < mapPalette.length; i++) {
                const rangeStart = breaks[i];
                const rangeEnd = breaks[i + 1];

                const formatNumber = (num) => {
                    if (num === null || num === undefined) return "";
                    return num.toLocaleString('tr-TR', {
                        minimumFractionDigits: isInteger ? 0 : 2,
                        maximumFractionDigits: isInteger ? 0 : 2
                    });
                };

                const startStr = formatNumber(rangeStart);
                const endStr = formatNumber(rangeEnd);

                const row = legendContent.append("g").attr("transform", `translate(0, ${i * 25})`);

                row.append("rect")
                    .attr("width", boxSize)
                    .attr("height", boxSize)
                    .attr("rx", 3)
                    .attr("ry", 3)
                    .style("fill", mapPalette[i])
                    .style("stroke", "#999")
                    .style("stroke-width", 0.5);

                row.append("text")
                    .attr("x", boxSize + 8)
                    .attr("y", boxSize / 2 + 5)
                    .attr("class", "legend-map-item")
                    .text(`${startStr} - ${endStr}`);
            }

            const contentBBox = legendContent.node().getBBox();
            const legWidth = contentBBox.width + (legPadding * 2);
            const legHeight = contentBBox.height + (legPadding * 2);

            let legX = 20;
            let legY = 20;

            if (pos === "bottomLeft") { legX = 20; legY = height - legHeight - 30; }
            else if (pos === "topLeft") { legX = 20; legY = 20; panY = 100; }
            else if (pos === "topRight") { legX = width - legWidth - 20; legY = 20; panY = 100; }
            else if (pos === "bottomRight") { legX = width - legWidth - 20; legY = height - legHeight - 30; }

            legendGroup.attr("transform", `translate(${legX}, ${legY})`);

            legendGroup.insert("rect", ".legend")
                .attr("width", legWidth)
                .attr("height", legHeight)
                .attr("rx", 8)
                .attr("ry", 8)
                .attr("fill", "rgba(255, 255, 255, 0.7)")
                .attr("stroke", "#ccc")
                .attr("stroke-width", 1);

            svg.transition()
                .duration(50)
                .call(zoom.transform, d3.zoomIdentity.translate(0, panY));

            toggleMapLabels();
        }

        // ETİKET AÇMA/KAPAMA FONKSİYONUNA DİNAMİK BOŞLUK (dy) HESAPLAMASI EKLENDİ
        function toggleMapLabels() {
            const showName = document.getElementById('chkShowNames').checked;
            const showValue = document.getElementById('chkShowValues').checked;
            const showPercent = document.getElementById('chkShowPercents').checked;

            d3.selectAll('.map-label-name').style('opacity', showName ? 1 : 0);
            d3.selectAll('.map-label-value').style('opacity', showValue ? 1 : 0);
            d3.selectAll('.map-label-percent').style('opacity', showPercent ? 1 : 0);

            // Dinamik Y (dy) boşluk hesaplaması
            let nameDy = "-0.4em";
            let valueDy = "0.8em";
            let percentDy = "2.0em";

            if (showName && showValue && showPercent) {
                // Hepsi açık
                nameDy = "-0.4em"; valueDy = "0.8em"; percentDy = "2.0em";
            } else if (showName && showValue && !showPercent) {
                // Sadece Bölge ve Değer
                nameDy = "-0.4em"; valueDy = "0.8em";
            } else if (showName && !showValue && showPercent) {
                // Sadece Bölge ve Yüzde: Yüzdeyi değerin olduğu yere taşı
                nameDy = "-0.4em"; percentDy = "0.8em";
            } else if (!showName && showValue && showPercent) {
                // Bölge yok, Değer ve Yüzdeyi yukarı taşı
                valueDy = "-0.4em"; percentDy = "0.8em";
            } else if (showName && !showValue && !showPercent) {
                // Sadece Bölge: Tam merkeze
                nameDy = "0.3em";
            } else if (!showName && showValue && !showPercent) {
                // Sadece Değer: Tam merkeze
                valueDy = "0.3em";
            } else if (!showName && !showValue && showPercent) {
                // Sadece Yüzde: Tam merkeze
                percentDy = "0.3em";
            }

            d3.selectAll('.map-label-name').attr('dy', nameDy);
            d3.selectAll('.map-label-value').attr('dy', valueDy);
            d3.selectAll('.map-label-percent').attr('dy', percentDy);
        }

        function drawChart(data, chartType, titleText, highlightedRegion) {
            const ctx = document.getElementById('myChart').getContext('2d');
            const legendContainer = document.getElementById('custom-legend');

            if (chartInstance) chartInstance.destroy();

            const sortedData = [...data].sort((a, b) => b.deger - a.deger);
            let labels = sortedData.map(d => d.bolge);
            let values = sortedData.map(d => d.deger);

            const highlightIndex = labels.indexOf(highlightedRegion);

            const generateColors = (count) => {
                const bg = [], br = [];
                for (let i = 0; i < count; i++) {
                    const hue = (i * 137.508) % 360;
                    bg.push(`hsl(${hue}, 70%, 80%)`);
                    br.push(`hsl(${hue}, 70%, 50%)`);
                }
                return { bg, border: br };
            };

            const colorSet = generateColors(values.length);
            const bgColors = colorSet.bg;
            const borderColors = colorSet.border;

            let type = chartType;
            let datasets = [];
            let options = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: splitTitle(titleText), font: { size: 14 } },
                    tooltip: {
                        callbacks: {
                            label: (context) => {
                                let label = context.dataset.label || '';
                                if (label) label += ': ';
                                if (context.parsed.y !== null) return label + context.parsed.y.toLocaleString('tr-TR');
                                return label;
                            }
                        }
                    }
                },
                layout: { padding: 10 }
            };

            if (chartType === 'horizontalBar' || chartType === 'bar') {
                type = 'bar';
                if (chartType === 'horizontalBar') options.indexAxis = 'y';

                const barBgColors = bgColors.map((color, i) => {
                    if (i === highlightIndex) return createDiagonalPattern(borderColors[i]);
                    return color;
                });

                const barBorderWidths = bgColors.map((_, i) => i === highlightIndex ? 3 : 1);

                datasets = [{
                    label: 'Değer',
                    data: values,
                    backgroundColor: barBgColors,
                    borderColor: borderColors,
                    borderWidth: barBorderWidths
                }];
            }
            else if (chartType === 'pie' || chartType === 'doughnut' || chartType === 'polarArea') {
                type = chartType;
                const sliceOffsets = labels.map((_, i) => i === highlightIndex ? 30 : 0);

                datasets = [{
                    label: 'Değer',
                    data: values,
                    backgroundColor: bgColors,
                    borderColor: borderColors,
                    borderWidth: 1,
                    offset: sliceOffsets
                }];
            }
            else if (chartType === 'lollipop') {
                type = 'bar';
                datasets = [{
                    label: 'Çubuk', data: values, backgroundColor: borderColors, barPercentage: 0.05, borderWidth: 0
                }, {
                    type: 'scatter',
                    label: 'Değer',
                    data: values.map((v, i) => ({ x: labels[i], y: v })),
                    backgroundColor: borderColors,
                    radius: values.map((_, i) => i === highlightIndex ? 10 : 6)
                }];
                options.scales = { x: { type: 'category', labels: labels } };
            }
            else if (chartType === 'line' || chartType === 'radar') {
                type = chartType;

                const pointRadii = labels.map((_, i) => i === highlightIndex ? 10 : 4);
                const pointBorderWidths = labels.map((_, i) => i === highlightIndex ? 3 : 1);
                const pointBgColors = labels.map((_, i) => i === highlightIndex ? '#e74c3c' : 'rgba(52, 152, 219, 1)');

                datasets = [{
                    label: 'Değer',
                    data: values,
                    backgroundColor: 'rgba(52, 152, 219, 0.2)',
                    borderColor: '#3498db',
                    borderWidth: 2,
                    fill: true,
                    pointRadius: pointRadii,
                    pointHoverRadius: pointRadii.map(r => r + 2),
                    pointBackgroundColor: pointBgColors,
                    pointBorderWidth: pointBorderWidths
                }];
            }
            else if (chartType === 'bubble') {
                type = 'bubble';
                const maxVal = Math.max(...values);
                datasets = [{
                    label: 'Bölgeler',
                    data: sortedData.map((d, i) => ({ x: i, y: d.deger, r: (d.deger / maxVal) * 30 })),
                    backgroundColor: bgColors,
                    borderColor: borderColors,
                    borderWidth: sortedData.map((d, i) => (d.bolge === highlightedRegion) ? 4 : 1)
                }];
                options.plugins.tooltip.callbacks.label = (ctx) => labels[ctx.dataIndex] + ': ' + ctx.raw.y.toLocaleString('tr-TR');
                options.scales = { x: { ticks: { callback: (val, index) => labels[index] || '' } } };
            }
            else if (chartType === 'histogram') {
                type = 'bar';
                const { counts, binLabels } = createHistogramData(values);
                labels = binLabels;
                datasets = [{
                    label: 'Frekans', data: counts, backgroundColor: 'rgba(52, 152, 219, 0.6)', borderWidth: 1,
                    barPercentage: 1.0, categoryPercentage: 1.0
                }];
                options.plugins.title.text = [splitTitle(titleText), "(Histogram)"];
            }
            else if (chartType === 'density') {
                type = 'line';
                const { counts, binLabels } = createHistogramData(values);
                labels = binLabels;
                datasets = [{
                    label: 'Yoğunluk', data: counts, fill: true, backgroundColor: 'rgba(231, 76, 60, 0.2)', borderColor: '#e74c3c', tension: 0.4
                }];
                options.plugins.title.text = [splitTitle(titleText), "(Yoğunluk)"];
            }
            else if (chartType === 'boxplot') {
                type = 'scatter';
                const min = Math.min(...values);
                const max = Math.max(...values);
                const avg = values.reduce((a, b) => a + b, 0) / values.length;

                options.scales = {
                    x: { type: 'category', labels: labels },
                    y: { title: { display: true, text: 'Değer' } }
                };

                const boxBgColors = labels.map((_, i) => i === highlightIndex ? '#e74c3c' : '#8e44ad');

                datasets = [
                    {
                        type: 'bar',
                        label: 'Değer',
                        data: values,
                        backgroundColor: boxBgColors,
                        barPercentage: 0.1,
                        order: 1
                    },
                    {
                        type: 'line',
                        label: 'Ortalama',
                        data: new Array(values.length).fill(avg),
                        borderColor: '#e74c3c',
                        borderWidth: 2,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        fill: false,
                        order: 0
                    },
                    {
                        type: 'line',
                        label: 'Veri Aralığı (Min-Max)',
                        data: new Array(values.length).fill(max),
                        fill: {
                            target: { value: min },
                            above: 'rgba(200, 200, 200, 0.2)'
                        },
                        borderColor: 'transparent',
                        pointRadius: 0,
                        order: 2
                    }
                ];
                options.plugins.tooltip.callbacks.title = (ctx) => ctx[0].label;
            }
            else {
                datasets = [{
                    label: 'Değer',
                    data: values,
                    backgroundColor: bgColors,
                    borderColor: borderColors,
                    borderWidth: 1
                }];
            }

            const showLegend = ['pie', 'doughnut', 'polarArea', 'bubble'].includes(chartType);

            if (showLegend) {
                legendContainer.style.display = 'flex';
                legendContainer.innerHTML = '';

                sortedData.forEach((d, i) => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';

                    if (d.bolge === highlightedRegion) {
                        item.style.fontWeight = 'bold';
                        item.style.backgroundColor = '#f0f0f0';
                        item.style.borderLeft = '3px solid #333';
                    }

                    const leftPart = document.createElement('div');
                    leftPart.className = 'legend-left-part';

                    const colorBox = document.createElement('div');
                    colorBox.className = 'legend-color-box';
                    colorBox.style.backgroundColor = bgColors[i];

                    const regionSpan = document.createElement('span');
                    regionSpan.className = 'legend-region';
                    regionSpan.innerText = d.bolge;
                    regionSpan.title = d.bolge;

                    leftPart.appendChild(colorBox);
                    leftPart.appendChild(regionSpan);

                    const valSpan = document.createElement('span');
                    valSpan.className = 'legend-value';
                    valSpan.innerText = d.deger.toLocaleString('tr-TR');

                    item.appendChild(leftPart);
                    item.appendChild(valSpan);
                    legendContainer.appendChild(item);
                });
            } else {
                legendContainer.style.display = 'none';
            }

            chartInstance = new Chart(ctx, {
                type: type,
                data: { labels: labels, datasets: datasets },
                options: options
            });
        }

        function splitTitle(str) {
            if (!str) return "";
            if (str.length > 50) {
                const middle = Math.floor(str.length / 2);
                const before = str.lastIndexOf(' ', middle);
                const after = str.indexOf(' ', middle + 1);
                if (before == -1 || (after != -1 && middle - before >= after - middle)) {
                    return [str.substr(0, after), str.substr(after + 1)];
                } else {
                    return [str.substr(0, before), str.substr(before + 1)];
                }
            }
            return str;
        }

        function createHistogramData(values) {
            const min = Math.min(...values);
            const max = Math.max(...values);
            const binCount = 5;
            const step = (max - min) / binCount;
            const counts = new Array(binCount).fill(0);
            const binLabels = [];

            for (let i = 0; i < binCount; i++) {
                const start = min + (i * step);
                const end = min + ((i + 1) * step);
                binLabels.push(`${Math.round(start)}-${Math.round(end)}`);
            }
            values.forEach(v => {
                let idx = Math.floor((v - min) / step);
                if (idx >= binCount) idx = binCount - 1;
                counts[idx]++;
            });
            return { counts, binLabels };
        }

        function drawTable(data) {
            const tbody = document.querySelector("#dataTable tbody");
            tbody.innerHTML = "";
            data.forEach(d => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${d.bolge}</td>
                    <td>${d.kategori}</td>
                    <td>${d.veri}</td>
                    <td>${d.yil}</td>
                    <td>${d.deger !== null && d.deger !== undefined ? d.deger.toLocaleString('tr-TR') : '-'}</td>
                    <td>${d['Veri Kaynağı'] || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function downloadExcel() {
            const selectedCat = document.getElementById('categorySelect').value;
            const selectedType = document.getElementById('dataSelect').value;
            const selectedYear = document.getElementById('yearSelect').value;
            const currentData = rawData.filter(d => d.kategori === selectedCat && d.veri === selectedType && String(d.yil) === String(selectedYear));

            const excelData = currentData.map(d => ({
                "Bölge Kodu": d.bolge,
                "Kategori": d.kategori,
                "Veri Türü": d.veri,
                "Yıl": d.yil,
                "Değer": d.deger,
                "Veri Kaynağı": d['Veri Kaynağı'] || '-'
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Veriler");
            XLSX.writeFile(wb, "bolge_verileri.xlsx");
        }

        function downloadMap() {
            html2canvas(document.getElementById("card-map"), {
                ignoreElements: (element) => element.classList.contains('map-options')
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'harita.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function downloadChart() {
            html2canvas(document.getElementById("chart-container-flex")).then(canvas => {
                const link = document.createElement('a');
                link.download = 'grafik.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
