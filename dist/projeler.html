<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAKA Proje Analiz Portalı</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            overflow-y: auto;
            background: white;
            border-right: 1px solid #dee2e6;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        /* Sağ Taraf (İçerik) */
        .content-area {
            height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Taşmayı engelle, iç elementler boyutlanacak */
        }

        /* --- YAPILAN DEĞİŞİKLİK 1: Yükseklik Ayarları --- */
        .map-wrapper {
            height: 70vh;
            /* Harita %70 */
            position: relative;
            border-bottom: 5px solid #dee2e6;
            flex-shrink: 0;
            /* Küçülmesini engelle */
        }

        .table-wrapper {
            height: 30vh;
            /* Tablo %30 */
            padding: 10px 20px;
            background: white;
            overflow-y: auto;
            /* Sadece tablo alanı scroll etsin */
            flex-grow: 1;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .filter-section {
            margin-bottom: 10px;
        }

        .filter-label {
            font-size: 0.80rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 2px;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* --- SELECT2 ÖZELLEŞTİRMELERİ --- */
        .select2-container .select2-selection {
            min-height: 28px !important;
            font-size: 0.8rem !important;
        }

        .select2-container--bootstrap-5 .select2-selection--single {
            padding: 2px 8px !important;
            height: 28px !important;
        }

        .select2-container--bootstrap-5 .select2-selection--multiple {
            padding: 2px !important;
            min-height: 28px !important;
        }

        .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice {
            background-color: #0d47a1 !important;
            color: #ffffff !important;
            font-size: 0.75rem !important;
            border: none;
            border-radius: 3px;
            padding: 0px 4px !important;
            margin: 1px !important;
            display: inline-flex;
            align-items: center;
        }

        .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice .select2-selection__choice__remove {
            width: 0.6rem;
            height: 0.6rem;
            padding: 0;
            margin-right: 4px;
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        .select2-search__field {
            margin-top: 2px !important;
            height: 20px !important;
        }

        .select2-results__option {
            font-size: 0.8rem !important;
            padding: 4px 8px !important;
        }

        /* Tablo Stilleri */
        .table-responsive {
            font-size: 0.80rem;
        }

        .table thead th {
            background-color: #f1f3f5;
            position: sticky;
            top: 0;
            z-index: 10;
            /* Başlık sabit kalsın */
        }
    </style>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="theme-color" content="#0b1733">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">
    <meta property="og:site_name" content="Türkiye Bölgesel Veri Analizleri">
    <meta property="og:title" content="DAKA Proje Analiz Portalı">
    <meta property="og:description" content="81 il, 26 Düzey 2 bölge ve 2.900'ü aşkın gösterge: TÜİK, OECD, Eurostat ve MEB verileriyle harita, grafik ve analiz.">
    <meta property="og:url" content="https://bolgeselveriportali.ekutlu.com/projeler.html">
    <meta property="og:image" content="https://bolgeselveriportali.ekutlu.com/img/og.png">
    <meta property="og:image:secure_url" content="https://bolgeselveriportali.ekutlu.com/img/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Türkiye Bölgesel Veri Analizleri: il ve bölge göstergeleri haritası">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DAKA Proje Analiz Portalı">
    <meta name="twitter:description" content="81 il, 26 Düzey 2 bölge ve 2.900'ü aşkın gösterge: TÜİK, OECD, Eurostat ve MEB verileriyle harita, grafik ve analiz.">
    <meta name="twitter:image" content="https://bolgeselveriportali.ekutlu.com/img/og.png">
</head>

<body>

    <div id="loading" class="loading">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-3">Veriler Yükleniyor...</div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar">
                <h6 class="mb-3 text-primary fw-bold"><i class="fa-solid fa-filter"></i> Proje Filtreleme</h6>

                <div class="d-grid gap-2 mb-3">
                    <button class="btn btn-primary btn-sm" onclick="applyFilters()">
                        <i class="fa-solid fa-play"></i> Uygula
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()">
                        <i class="fa-solid fa-rotate-left"></i> Temizle
                    </button>
                    <hr class="my-1">
                    <button class="btn btn-success btn-sm" onclick="downloadMap()">
                        <i class="fa-solid fa-camera"></i> Haritayı İndir (PNG)
                    </button>
                    <button class="btn btn-dark btn-sm" onclick="downloadTableData()">
                        <i class="fa-solid fa-file-csv"></i> Tabloyu İndir (CSV)
                    </button>
                </div>

                <div id="filters-container"></div>

                <hr>

                <div class="filter-section">
                    <div class="filter-label">Nihai Bütçe (TL)</div>
                    <select id="filter-butce" class="form-select select2-simple">
                        <option value="all">Tümü</option>
                        <option value="0-100000">0 - 100.000</option>
                        <option value="100000-500000">100.000 - 500.000</option>
                        <option value="500000-1000000">500.000 - 1.000.000</option>
                        <option value="1000000-5000000">1.000.000 - 5.000.000</option>
                        <option value="5000000-99999999999">5.000.000 +</option>
                    </select>
                </div>

                <div class="filter-section">
                    <div class="filter-label">Nihai Hibe (TL)</div>
                    <select id="filter-hibe" class="form-select select2-simple">
                        <option value="all">Tümü</option>
                        <option value="0-100000">0 - 100.000</option>
                        <option value="100000-500000">100.000 - 500.000</option>
                        <option value="500000-1000000">500.000 - 1.000.000</option>
                        <option value="1000000-5000000">1.000.000 - 5.000.000</option>
                        <option value="5000000-99999999999">5.000.000 +</option>
                    </select>
                </div>

                <div class="mt-2 text-muted small">
                    Toplam <span id="count-display" class="fw-bold">0</span> proje listelendi.
                </div>
            </div>

            <div class="col-md-9 content-area">

                <div class="map-wrapper">
                    <div id="map"></div>
                </div>

                <div class="table-wrapper">
                    <h6 class="text-primary fw-bold mb-2 sticky-top bg-white"><i class="fa-solid fa-table-list"></i>
                        Proje Listesi</h6>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover table-bordered table-sm" id="projects-table">
                            <thead>
                                <tr>
                                    <th>Yıl</th>
                                    <th>İl</th>
                                    <th>İlçe</th>
                                    <th>Proje Adı</th>
                                    <th>Kurum</th>
                                    <th>Destek Tipi</th>
                                    <th class="text-end">Bütçe</th>
                                    <th class="text-end">Hibe</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
        // --- 1. Değişkenler ---
        let map, geoJsonLayer, markersLayer;
        let globalData = [];
        let currentFilteredData = [];
        let geoData = null;

        const filterFields = [
            { id: 'yili', label: 'Yıl' },
            { id: 'destektipi', label: 'Destek Tipi' },
            { id: 'gelismeekseni', label: 'Gelişme Ekseni' },
            { id: 'il', label: 'İl' },
            { id: 'ilce', label: 'İlçe' },
            { id: 'nace1', label: 'Sektör (NACE 1)' },
            { id: 'kurumtipi', label: 'Kurum Tipi' },
            { id: 'kurumturu', label: 'Kurum Türü' }
        ];

        // --- 2. Başlangıç ---
        $(document).ready(function () {
            initMap();
            createFilterElements();
            loadData();

            $('.select2-simple').select2({
                theme: 'bootstrap-5',
                minimumResultsForSearch: Infinity
            });
        });

        // --- 3. Harita Kurulumu ---
        function initMap() {
            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap', crossOrigin: true
            });
            const uydu = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles © Esri', crossOrigin: true
            });
            const fiziki = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles © Esri', crossOrigin: true
            });

            map = L.map('map', {
                center: [38.5, 41.5],
                zoom: 7,
                layers: [osm]
            });

            const baseMaps = {
                "Sokak": osm,
                "Uydu": uydu,
                "Fiziki": fiziki
            };

            L.control.layers(baseMaps).addTo(map);
            markersLayer = L.featureGroup().addTo(map);
        }

        // --- 4. Veri Yükleme ---
        function loadData() {
            fetch('./data/tr.geojson')
                .then(res => res.json())
                .then(data => {
                    geoData = data;
                    Papa.parse("./data/projeler.csv", {
                        download: true,
                        header: true,
                        dynamicTyping: true,
                        skipEmptyLines: true,
                        complete: function (results) {
                            globalData = results.data;
                            populateFilters(globalData);
                            applyFilters();
                            $('#loading').fadeOut();
                        },
                        error: function (err) {
                            alert("CSV dosyası okunamadı: " + err);
                            $('#loading').fadeOut();
                        }
                    });
                })
                .catch(err => {
                    alert("tr.json yüklenemedi.");
                    $('#loading').fadeOut();
                });
        }

        // --- 5. Filtre Arayüzü ---
        function createFilterElements() {
            const container = $('#filters-container');
            filterFields.forEach(field => {
                const html = `
                    <div class="filter-section">
                        <div class="filter-label">${field.label}</div>
                        <select id="filter-${field.id}" class="form-select filter-multi" multiple="multiple" style="width: 100%">
                        </select>
                    </div>
                `;
                container.append(html);
            });

            $('.filter-multi').select2({
                theme: 'bootstrap-5',
                placeholder: 'Seçiniz...',
                allowClear: true,
                closeOnSelect: false,
                width: '100%'
            });
        }

        function populateFilters(data) {
            filterFields.forEach(field => {
                const uniqueValues = new Set();
                data.forEach(row => {
                    if (row[field.id]) uniqueValues.add(row[field.id]);
                });

                const sorted = Array.from(uniqueValues).sort();
                const select = $(`#filter-${field.id}`);

                sorted.forEach(val => {
                    select.append(new Option(val, val, false, false));
                });
            });
        }

        // --- 6. Filtreleme ---
        function applyFilters() {
            const activeFilters = {};
            filterFields.forEach(field => {
                const val = $(`#filter-${field.id}`).val();
                if (val && val.length > 0) {
                    activeFilters[field.id] = val;
                }
            });

            const butceRange = $('#filter-butce').val();
            const hibeRange = $('#filter-hibe').val();

            const filtered = globalData.filter(row => {
                for (const [key, selectedValues] of Object.entries(activeFilters)) {
                    if (!selectedValues.includes(String(row[key]))) return false;
                }
                if (!checkRange(row.nihaibutce, butceRange)) return false;
                if (!checkRange(row.nihaihibe, hibeRange)) return false;
                return true;
            });

            currentFilteredData = filtered;

            updateMap(filtered);
            renderTable(filtered);
            $('#count-display').text(filtered.length);
        }

        function checkRange(val, rangeStr) {
            if (rangeStr === 'all' || !rangeStr) return true;
            if (val === null || val === undefined) return false;
            const parts = rangeStr.split('-');
            const min = parseFloat(parts[0]);
            const max = parseFloat(parts[1]);
            return val >= min && val <= max;
        }

        function resetFilters() {
            $('.filter-multi').val(null).trigger('change');
            $('#filter-butce').val('all').trigger('change');
            $('#filter-hibe').val('all').trigger('change');
            applyFilters();
        }

        // --- 7. Tablo Oluşturma ---
        function renderTable(data) {
            const tbody = $('#projects-table tbody');
            tbody.empty();

            const displayLimit = 500;
            const displayData = data.slice(0, displayLimit);

            let html = '';
            displayData.forEach(row => {
                html += `
                    <tr>
                        <td>${row.yili || '-'}</td>
                        <td>${row.il || '-'}</td>
                        <td>${row.ilce || '-'}</td>
                        <td>${row.projeadi || '-'}</td>
                        <td>${row.basvuran || '-'}</td>
                        <td>${row.destektipi || '-'}</td>
                        <td class="text-end">${formatMoney(row.nihaibutce)}</td>
                        <td class="text-end">${formatMoney(row.nihaihibe)}</td>
                    </tr>
                `;
            });

            if (data.length > displayLimit) {
                html += `<tr><td colspan="8" class="text-center text-muted">... ve ${data.length - displayLimit} kayıt daha ...</td></tr>`;
            }

            tbody.append(html);
        }

        // --- 8. Harita Güncelleme ---
        function updateMap(data) {
            markersLayer.clearLayers();
            if (geoJsonLayer) map.removeLayer(geoJsonLayer);

            const activeProvinces = new Set(data.map(d => d.il ? trToEnglish(d.il.toLowerCase()) : ""));

            if (geoData) {
                geoJsonLayer = L.geoJSON(geoData, {
                    style: function (feature) {
                        const geoName = trToEnglish(feature.properties.name.toLowerCase());
                        const isActive = activeProvinces.has(geoName);

                        return {
                            fillColor: isActive ? '#d63384' : '#6c757d',
                            weight: 1,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: isActive ? 0.4 : 0.1
                        };
                    }
                }).addTo(map);
            }

            const markerBounds = L.latLngBounds();
            let hasMarkers = false;

            data.forEach(row => {
                if (row.lat && row.lon) {
                    const lat = parseFloat(row.lat);
                    const lon = parseFloat(row.lon);

                    const marker = L.circleMarker([lat, lon], {
                        radius: 6,
                        fillColor: "#0d6efd",
                        color: "#fff",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });

                    const popupContent = `
                        <strong>${row.projeadi || 'İsimsiz'}</strong><hr class="my-1">
                        <b>İl/İlçe:</b> ${row.il}/${row.ilce}<br>
                        <b>Bütçe:</b> ${formatMoney(row.nihaibutce)}
                    `;
                    marker.bindPopup(popupContent);
                    markersLayer.addLayer(marker);
                    markerBounds.extend([lat, lon]);
                    hasMarkers = true;
                }
            });

            if (hasMarkers) {
                map.fitBounds(markerBounds, { padding: [50, 50] });
            } else {
                map.setView([38.5, 42], 7);
            }
        }

        // --- 9. Yardımcılar ---

        // YAPILAN DEĞİŞİKLİK 2: Para formatını "1.000 ₺" şeklinde (sonda) olacak şekilde güncelledik.
        function formatMoney(amount) {
            if (!amount) return "0 ₺";
            return amount.toLocaleString('tr-TR', { maximumFractionDigits: 0 }) + ' ₺';
        }

        function trToEnglish(text) {
            if (!text) return "";
            return text.replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s")
                .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ç/g, "c")
                .replace(/Ğ/g, "g").replace(/Ü/g, "u").replace(/Ş/g, "s")
                .replace(/İ/g, "i").replace(/Ö/g, "o").replace(/Ç/g, "c");
        }

        // --- 10. İndirme Fonksiyonları ---
        function getVisibleBounds() {
            const combinedBounds = L.latLngBounds();
            let hasBounds = false;

            if (markersLayer && markersLayer.getLayers().length > 0) {
                combinedBounds.extend(markersLayer.getBounds());
                hasBounds = true;
            }

            if (geoJsonLayer && currentFilteredData.length > 0) {
                const activeProvinces = new Set(currentFilteredData.map(d => d.il ? trToEnglish(d.il.toLowerCase()) : ""));

                geoJsonLayer.eachLayer(layer => {
                    if (layer.feature && layer.feature.properties) {
                        const geoName = trToEnglish(layer.feature.properties.name.toLowerCase());
                        if (activeProvinces.has(geoName)) {
                            combinedBounds.extend(layer.getBounds());
                            hasBounds = true;
                        }
                    }
                });
            }

            return { bounds: combinedBounds, isValid: hasBounds };
        }

        function downloadMap() {
            const result = getVisibleBounds();
            if (result.isValid) {
                map.fitBounds(result.bounds, { animate: false, padding: [20, 20] });
            }

            setTimeout(() => {
                const mapDiv = document.getElementById("map");
                html2canvas(mapDiv, {
                    useCORS: true,
                    allowTaint: false,
                    ignoreElements: (el) => el.classList.contains('leaflet-control-zoom')
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'proje_haritasi.png';
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }).catch(err => {
                    console.error(err);
                    alert("İndirme hatası.");
                });
            }, 500);
        }

        function downloadTableData() {
            if (!currentFilteredData || currentFilteredData.length === 0) {
                alert("İndirilecek veri yok.");
                return;
            }
            const csv = Papa.unparse(currentFilteredData, { quotes: true, delimiter: ";" });
            const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "proje_verileri.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>

</html>
